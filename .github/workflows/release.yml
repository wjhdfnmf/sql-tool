name: Release

# Pushing a tag such as v0.1.0 builds the installers on Windows, Linux and
# macOS and attaches them, with checksums, to a draft release. The draft is
# not public until someone publishes it by hand.
#
# The installers are not code-signed.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  APPIMAGE_EXTRACT_AND_RUN: 1
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft if it does not exist yet
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "${TAG#v}" --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries the desktop shell needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Build the UI
        working-directory: app
        run: npm run build

      - name: Run the tests
        run: cargo test --workspace --locked

      - name: Build the installers
        working-directory: app
        run: npm run tauri build

      - name: Attach the installers and their checksums
        run: |
          shopt -s nullglob
          files=(
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced." >&2
            exit 1
          fi
          sums=()
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if command -v sha256sum >/dev/null; then
              (cd "$(dirname "$file")" && sha256sum "$name" > "$name.sha256")
            else
              (cd "$(dirname "$file")" && shasum -a 256 "$name" > "$name.sha256")
            fi
            sums+=("$file.sha256")
          done
          gh release upload "$TAG" "${files[@]}" "${sums[@]}" --clobber
