name: CI

# Builds, tests and packages on Windows, Linux and macOS for every push to
# main and every pull request. Only actions maintained by GitHub are used.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only help when the build directory is reused.
  CARGO_INCREMENTAL: 0
  # Lets the AppImage tooling run on runners without FUSE.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # The oldest Ubuntu there is a runner for, not the newest: a program
          # built against a C library runs on that version and later ones,
          # so this is what decides which Linux systems the packages start on.
          - name: Linux
            os: ubuntu-22.04
          # One app for both kinds of Mac, Apple silicon and Intel.
          - name: macOS
            os: macos-latest
            tauri-args: --target universal-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries the desktop shell needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm xvfb

      # The version named in rust-toolchain.toml, with its lints and formatter.
      - name: Install the Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustc --version

      - name: Add both Mac targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache downloaded crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: crates-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Type-check the UI
        working-directory: app
        run: npm run check

      # The desktop shell embeds the built UI, so this comes before any cargo step.
      - name: Build the UI
        working-directory: app
        run: npm run build

      # The same on every system, so one of them is enough. After the UI is
      # built, because the desktop shell does not compile without it.
      - name: Check formatting and lints
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      # Unit tests, plus login, TLS and query tests against the fake MySQL
      # server in this repository. No database is needed.
      - name: Run the tests
        run: cargo test --workspace --locked

      # Release builds leave the demo server out; make sure the development
      # build, which includes it, still compiles.
      - name: Check the development build
        run: cargo check --locked -p sqltool-app --features devtools

      - name: Build the installers
        working-directory: app
        run: npm run tauri build -- ${{ matrix.tauri-args }}

      # The installers are built; what is not yet known is whether the app in
      # them starts on this system. So it is built once more with its test
      # server inside, started, and left to check itself: connect, run a
      # query through the real interface, copy, export. No database is needed.
      - name: Start the app and let it check itself
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # For this Mac's own processor, beside what the universal build made for it.
            host="$(rustc -vV | sed -n 's/^host: //p')"
            cargo build --release --locked -p sqltool-app --features custom-protocol,devtools --target "$host"
            bash tests/smoke.sh "target/$host/release/sqltool-app"
          else
            cargo build --release --locked -p sqltool-app --features custom-protocol,devtools
            bash tests/smoke.sh
          fi

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: sql-tool-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
