name: CI

# Builds, tests and packages on Windows, Linux and macOS for every push to
# main and every pull request. Only actions maintained by GitHub are used.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only help when the build directory is reused.
  CARGO_INCREMENTAL: 0
  # Lets the AppImage tooling run on runners without FUSE.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries the desktop shell needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache downloaded crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: crates-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Type-check the UI
        working-directory: app
        run: npm run check

      # The desktop shell embeds the built UI, so this comes before any cargo step.
      - name: Build the UI
        working-directory: app
        run: npm run build

      # Unit tests, plus login, TLS and query tests against the fake MySQL
      # server in this repository. No database is needed.
      - name: Run the tests
        run: cargo test --workspace --locked

      # Release builds leave the demo server out; make sure the development
      # build, which includes it, still compiles.
      - name: Check the development build
        run: cargo check --locked -p sqltool-app --features devtools

      - name: Build the installers
        working-directory: app
        run: npm run tauri build

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: sql-tool-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
