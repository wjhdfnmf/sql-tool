[package]
name = "sqltool-app"
description = "Desktop SQL client for MySQL and MariaDB."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
# Serve the built UI from inside the executable. `tauri build` turns this on;
# pass it by hand when building with plain cargo.
custom-protocol = ["tauri/custom-protocol"]
# Built-in fake server ("Demo server") and the unattended self-test.
# For development only: off by default, so release builds do not carry it.
# Turn it on with `--features devtools` (`npm run tauri:dev` does).
devtools = ["dep:sqltool-fakeserver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: a picture of a chart arrives as a PNG and is put on the clipboard as pixels.
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
secrecy = "0.10"
sqltool-core = { path = "../../crates/core" }
sqltool-secrets = { path = "../../crates/secrets" }
sqltool-fakeserver = { path = "../../crates/fakeserver", optional = true }
tauri-plugin-dialog = "2"
# Copying goes through the system's own clipboard. The web view's is refused
# on Linux and macOS unless the write happens inside the click itself, and a
# copy here first asks the backend for the text.
tauri-plugin-clipboard-manager = "2"
# The window opens where it was, at the size it had.
tauri-plugin-window-state = "2"
# A second start brings the running app to the front instead of opening another.
tauri-plugin-single-instance = "2"
# The dialog plugin's own library, used directly for the one message that has
# to be shown when the app cannot start and there is no window to show it in.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
